name: Real DOCX Corpus Check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    paths:
      - "source_understanding/**"
      - "benchmarks/docx_structure_real_v0_1/**"
      - ".github/workflows/source-understanding-real-docx.yml"

permissions:
  contents: read

jobs:
  real-docx:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependency
        run: python -m pip install --disable-pip-version-check "pydantic>=2,<3"
      - name: Compile real DOCX benchmark
        run: python -m compileall -q source_understanding benchmarks/docx_structure_real_v0_1
      - name: Run pinned real-world DOCX frozen-contract benchmark
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: python -m benchmarks.docx_structure_real_v0_1.run_benchmark --fail-on-error --report /tmp/docx-structure-real-v0.1-report.json
      - name: Run SU4.1 reviewed structural benchmark
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: python -m benchmarks.docx_structure_real_v0_1.run_reviewed_benchmark --report /tmp/docx-structure-real-su4.1-report.json
      - name: Upload real-DOCX benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-docx-structure-reports
          path: /tmp/docx-structure-real-*.json
          if-no-files-found: warn
          retention-days: 14
