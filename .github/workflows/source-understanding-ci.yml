name: Source Understanding CI

on:
  push:
    paths:
      - "source_understanding/**"
      - "tests/test_*.py"
      - ".github/workflows/source-understanding-ci.yml"
  pull_request:
    paths:
      - "source_understanding/**"
      - "tests/test_*.py"
      - ".github/workflows/source-understanding-ci.yml"

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install minimal test dependency
        run: python -m pip install --disable-pip-version-check "pydantic>=2,<3"
      - name: Compile source and tests
        run: python -m compileall -q source_understanding tests
      - name: Run source-understanding unittest suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
