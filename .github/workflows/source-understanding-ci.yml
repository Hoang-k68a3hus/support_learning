name: Source Understanding CI

on:
  push:
    paths:
      - "source_understanding/**"
      - "ai_data_studio/**"
      - "benchmarks/docx_structure_v0_1/**"
      - "benchmarks/docx_structure_real_v0_1/**"
      - "tests/test_*.py"
      - "tests/ai_data_studio/**"
      - "pyrightconfig.json"
      - ".github/workflows/source-understanding-ci.yml"
      - ".github/workflows/source-understanding-real-docx.yml"
  pull_request:
    paths:
      - "source_understanding/**"
      - "ai_data_studio/**"
      - "benchmarks/docx_structure_v0_1/**"
      - "benchmarks/docx_structure_real_v0_1/**"
      - "tests/test_*.py"
      - "tests/ai_data_studio/**"
      - "pyrightconfig.json"
      - ".github/workflows/source-understanding-ci.yml"
      - ".github/workflows/source-understanding-real-docx.yml"

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test and static-check dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "pydantic>=2,<3" "argilla==2.8.0" "pymupdf==1.28.0"
          "fastapi>=0.115,<1" "standardwebhooks>=1,<2"
          "ruff>=0.9,<1" "pyright>=1.1,<2"
      - name: Compile source tests and benchmarks
        run: python -m compileall -q source_understanding ai_data_studio tests benchmarks/docx_structure_v0_1 benchmarks/docx_structure_real_v0_1
      - name: Run high-signal Ruff checks
        run: python -m ruff check source_understanding ai_data_studio tests benchmarks --select E9,F63,F7,F82
      - name: Run source-understanding unittest suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run reproducible synthetic DOCX benchmark
        run: python -m benchmarks.docx_structure_v0_1.run_benchmark --report /tmp/docx-structure-v0.1-report.json
      - name: Run Pyright on format-agnostic core
        run: python -m pyright
